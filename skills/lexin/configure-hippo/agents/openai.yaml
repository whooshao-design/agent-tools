interface:
  display_name: "Configure Hippo"
  short_description: "安全新增、修改并在明确授权后发布标准、stable 或海外 Hippo 配置，并可在授权后新建 namespace 及分配修改/发布权"
  default_prompt: "使用 $configure-hippo 在标准、stable 或墨西哥/印尼海外 Hippo 中新增或修改一项配置，或给应用新建 namespace 并分配修改权/发布权；默认只保存草稿（stable 站点保存后自动按 key 发布），只有用户明确授权时才在其它站点发布、新建 namespace 或授权，并回读校验。"
policy:
  allow_implicit_invocation: true
